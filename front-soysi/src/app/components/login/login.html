<div class="login-page">
    <div class="login-card text-center">
        <div class="login-header text-center">
            <div class="brand-logo-wrap mb-3">
                <span class="logo-s">S</span>
            </div>
            <h2 class="fw-bold">Soy <span class="text-yellow">Sí</span></h2>
            <p class="text-white-50">Residencia Estudiantil - Fundación Sí</p>
        </div>

        <div class="login-body">
            <form (ngSubmit)="onLogin()">
                <div class="mb-4">
                    <label class="form-label text-white-50 small text-uppercase fw-bold">Email</label>
                     <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="ejemplo@fundacionsi.org" required>
                     </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white-50 small text-uppercase fw-bold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="********">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white-50 small text-uppercase fw-bold">DNI</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                        <input type="text" class="form-control" [(ngModel)]="dni" name="dni" placeholder="DNI sin puntos" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3">Ingresar</button>
            </form>
        </div>

        <div class="login-footer text-center mt-3">
            <p class="small text-white-50">¿Problemas con el acceso?</p>
            <p class="small"><a class="text-white-50" [href]="getWhatsappLink()" target="_blank" rel="noopener">Contactar por WhatsApp para registro</a></p>
            <p class="small text-white-50">Si ya tenés credenciales, ingresá arriba.</p>
        </div>
    </div>
</div>
