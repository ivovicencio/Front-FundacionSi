<section class="panel">
  <h3>Conteo Ocasa (Pedido entrante)</h3>
  <p class="subtitle">Carga de mercaderia nueva recibida para actualizar deposito.</p>

  <label class="date">
    Fecha de recepcion
    <input type="date" [(ngModel)]="fechaRecepcion">
  </label>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Producto</th>
          <th>Peso</th>
          <th>Unidad</th>
          <th>Paquetes</th>
          <th>Fardos</th>
          <th>Total Calculado</th>
          <th>Vencimiento</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of itemsRecibidos; let i = index">
          <td><input type="text" [(ngModel)]="item.codigo" placeholder="G-1234"></td>
          <td><input type="text" [(ngModel)]="item.nombre" placeholder="Producto"></td>
          <td><input type="number" min="0" [(ngModel)]="item.peso" (ngModelChange)="calcularTotal(item)"></td>
          <td>
            <select [(ngModel)]="item.unidad" (change)="calcularTotal(item)">
              <option value="KG">Kg</option>
              <option value="G">g</option>
              <option value="L">L</option>
              <option value="ML">ml</option>
              <option value="UNIDAD">Unidades</option>
            </select>
          </td>
          <td><input type="number" min="0" [(ngModel)]="item.paquetes" (ngModelChange)="calcularTotal(item)"></td>
          <td><input type="number" min="0" [(ngModel)]="item.fardos" (ngModelChange)="calcularTotal(item)"></td>
          <td class="total-cell">{{ formatTotal(item) }}</td>
          <td><input type="date" [(ngModel)]="item.vencimiento"></td>
          <td><button class="btn-delete" (click)="removeItem(i)">Eliminar</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="controls">
    <button class="btn-base btn-accent" (click)="agregarItem()">Agregar fila</button>
    <button class="btn-base btn-primary" (click)="confirmarRecepcion()">Guardar recepción OCASA</button>
  </div>

  <hr>

  <h4>Mercadería para residentes (bultos/cajas)</h4>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Estudiante</th>
          <th>Cantidad bultos/cajas</th>
          <th>Retiro</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of cajasResidentes; let j = index">
          <td><input type="text" [(ngModel)]="r.codigo"></td>
          <td><input type="text" [(ngModel)]="r.estudiante"></td>
          <td><input type="number" min="0" [(ngModel)]="r.cantidad"></td>
          <td><input type="text" [(ngModel)]="r.retiro" placeholder="Ej. fecha o nombre"></td>
          <td><button class="btn-delete" (click)="removeCajaResidente(j)">Eliminar</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="controls">
    <button class="btn-base btn-accent" (click)="agregarCajaResidente()">Agregar caja residente</button>
  </div>
</section>
