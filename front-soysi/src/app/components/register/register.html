<div class="register-page">
  <div class="register-container shadow-lg">
    <!-- Header del Panel de Registro -->
    <div class="register-header text-center mb-4">
      <div class="admin-badge"><i class="bi bi-person-plus-fill"></i></div>
      <h2 class="fw-bold mt-3">Alta de Usuario</h2>
      <p class="text-white-50">Panel exclusivo para Voluntarios</p>
    </div>

    <div class="register-body">
      <form (ngSubmit)="onRegister()">
        
        <!-- Nombre Completo -->
        <div class="mb-3">
          <label class="form-label small fw-bold text-uppercase">Nombre y Apellido</label>
          <input type="text" class="form-control" [(ngModel)]="nuevoUsuario.nombre" name="nombre" placeholder="Ej: Ivo Vicencio" required>
        </div>

        <!-- Email Institucional -->
        <div class="mb-3">
          <label class="form-label small fw-bold text-uppercase">Email</label>
          <input type="email" class="form-control" [(ngModel)]="nuevoUsuario.email" name="email" placeholder="email@fundacionsi.org" required>
        </div>

        <!-- DNI -->
        <div class="mb-3">
          <label class="form-label small fw-bold text-uppercase">DNI (Acceso inicial)</label>
          <input type="text" class="form-control" [(ngModel)]="nuevoUsuario.dni" name="dni" placeholder="Sin puntos ni espacios" required>
        </div>

        <!-- Selección de Rol -->
        <div class="mb-4">
          <label class="form-label small fw-bold text-uppercase">Asignar Rol en la Residencia</label>
          <select class="form-select" [(ngModel)]="nuevoUsuario.rol" name="rol">
            <option *ngFor="let rol of roles" [value]="rol.value">{{ rol.label }}</option>
          </select>
        </div>

        <!-- Botón de Acción -->
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-register">
            REGISTRAR EN EL SISTEMA
          </button>
          <button type="button" class="btn btn-link text-white-50" routerLink="/home">
            Cancelar y volver
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
