<div class="change-password-page">
  <div class="cp-card">
    <div class="cp-header">
      <div class="cp-icon">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h1 class="cp-title">Cambio de Contraseña</h1>
      <p class="cp-subtitle">Es tu primer ingreso. Creá una contraseña segura para continuar.</p>
    </div>

    <div *ngIf="error" class="alert-error">
      <i class="bi bi-exclamation-circle"></i> {{ error }}
    </div>

    <div *ngIf="success" class="alert-success">
      <i class="bi bi-check-circle"></i> Contraseña cambiada con éxito. Redirigiendo...
    </div>

    <form (ngSubmit)="onSubmit()" class="cp-form" *ngIf="!success">
      <div class="field">
        <label class="field-label">Contraseña actual (DNI)</label>
        <div class="input-group">
          <i class="bi bi-lock"></i>
          <input type="password" class="form-input" [(ngModel)]="currentPassword" name="currentPassword" placeholder="Ingresá tu DNI" required />
        </div>
      </div>

      <div class="field">
        <label class="field-label">Nueva contraseña</label>
        <div class="input-group">
          <i class="bi bi-key"></i>
          <input type="password" class="form-input" [(ngModel)]="newPassword" name="newPassword" placeholder="Mín. 8 caracteres, 1 mayúscula, 1 número" required />
        </div>
      </div>

      <div class="field">
        <label class="field-label">Confirmar contraseña</label>
        <div class="input-group">
          <i class="bi bi-key"></i>
          <input type="password" class="form-input" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repetí la nueva contraseña" required />
        </div>
      </div>

      <div class="requirements">
        <p class="req-title">La contraseña debe tener:</p>
        <ul>
          <li [class.req-ok]="newPassword.length >= 8">✓ Mínimo 8 caracteres</li>
          <li [class.req-ok]="/[A-Z]/.test(newPassword)">✓ Al menos una mayúscula</li>
          <li [class.req-ok]="/[0-9]/.test(newPassword)">✓ Al menos un número</li>
        </ul>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">Cambiar contraseña</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>
  </div>
</div>
